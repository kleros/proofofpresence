name: Local compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  production-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --test test/v10-netlify-build.test.mjs
      - run: npm run build:netlify:production
      - run: node test/frontend-fallback.e2e.mjs
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:contracts
      - run: npm --prefix references/kickback run test:site
      - run: npm --prefix references/kickback run test:console
