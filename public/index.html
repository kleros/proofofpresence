<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b174d" />
    <meta
      name="description"
      content="Independent events. Verifiable commitments. Manage event deposits, trusted attendance and Kleros disputes."
    />
    <title>Kleros · Events & commitments</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <a class="brand" href="#" aria-label="Kleros events home"
          ><span class="brand-mark" aria-hidden="true">K</span
          ><span
            >KLEROS<span class="brand-sub">EVENTS & COMMITMENTS</span></span
          ></a
        >
        <div class="workspace-label">WORKSPACE</div>
        <a class="nav-link active" href="#" id="all-events-link"
          ><span aria-hidden="true">◫</span> All events
          <span id="event-count" class="nav-count">—</span></a
        >
        <div class="sidebar-events" id="sidebar-events"></div>
        <div class="sidebar-foot">
          <div class="network-pip"><i></i> Local development</div>
          <p>Real contract logic.<br />Synthetic people. Local ETH.</p>
          <button class="text-link" id="demo-help" type="button">
            How this demo works <span aria-hidden="true">↗</span>
          </button>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <a class="mobile-brand" href="#" aria-label="All events"
            >K<span>LEROS</span></a
          >
          <div class="breadcrumb" id="breadcrumb">
            Workspace <span>/</span> All events
          </div>
          <div class="topbar-actions">
            <span class="environment" id="environment"><i></i> LOCAL CHAIN</span
            ><button
              class="button button-small button-quiet"
              id="refresh"
              type="button"
              title="Refresh authoritative chain state"
            >
              ↻ <span>Refresh</span>
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div class="page-loading" id="loading">
            <span class="spinner"></span>
            <p>Reading the event registry…</p>
          </div>
          <div id="content" hidden></div>
        </main>
        <footer class="footer">
          <span>Built on verifiable attendance.</span
          ><span>Native ETH · Kleros Court V1 · v7 compatibility</span>
        </footer>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="review-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <button class="dialog-close" aria-label="Close review" value="cancel">
          ×
        </button>
      </form>
      <div id="dialog-body"></div>
    </dialog>
  </body>
</html>
