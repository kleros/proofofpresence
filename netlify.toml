[build]
  command = "npm run build:netlify:production"
  publish = "dist/netlify-app"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The gateway requires KLEROS_BACKEND_URL, KLEROS_PUBLIC_ORIGIN and
# KLEROS_PROXY_SECRET in Netlify runtime variables. Never put the key in source.
# The unchanged financial runtime remains in one persistent private backend.
